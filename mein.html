<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #ffffff;
            color: #222222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 520px;
            text-align: center;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e8e8e8;
            margin: 0 auto 24px;
            /* 替换成你的头像：background-image: url("avatar.jpg"); background-size: cover; */
        }
        h1 {
            font-size: 28px;
            font-weight: 500;
            margin-bottom:12px;
        }
        .desc {
            font-size: 16px;
            color:#666;
            line-height:1.7;
            margin-bottom:36px;
        }
        .links {
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .links a {
            display:block;
            padding:14px 20px;
            border:1px solid #ddd;
            border-radius:10px;
            text-decoration:none;
            color:#333;
            font-size:16px;
            transition: 0.2s ease;
        }
        .links a:hover {
            background:#f7f7f7;
            border-color:#bbb;
        }
        footer {
            margin-top:60px;
            font-size:13px;
            color:#999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar"></div>
        <h1>你的名字</h1>
        <p class="desc">简单的个人介绍。专注于技术 / 学习 / 分享。欢迎来到我的个人主页。</p>
        <div class="links">
            <a href="#about">关于我</a>
            <a href="#works">作品项目</a>
            <a href="#blog">随笔博客</a>
            <a href="#contact">联系我</a>
        </div>
        <footer>© 2026 All Rights Reserved</footer>
    </div>
</body>
</html>
