<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 导航栏样式 */
        nav {
            background-color: #333;
            padding: 0;
            position: sticky;
            top: 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
        }

        nav ul li {
            margin: 0;
        }

        nav ul li a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            transition: background-color 0.3s;
        }

        nav ul li a:hover {
            background-color: #555;
        }

        /* 页面内容 */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            margin: 40px 0;
            padding: 20px;
            border-bottom: 1px solid #ddd;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="#home">首页</a></li>
            <li><a href="#about">关于我</a></li>
            <li><a href="#services">服务</a></li>
            <li><a href="#contact">联系我</a></li>
        </ul>
    </nav>

    <div class="container">
        <!-- 首页 -->
        <section id="home">
            <h1>欢迎来到我的网站</h1>
            <p>这是一个简单但美观的网站示例。</p>
            <p>导航栏已经准备好了，您可以点击上面的导航链接来浏览不同的部分。</p>
        </section>

        <!-- 关于我 -->
        <section id="about">
            <h1>关于我</h1>
            <p>这是关于我的介绍部分。</p>
            <p>您可以在这里添加您的个人信息、经历和兴趣。</p>
        </section>

        <!-- 服务 -->
        <section id="services">
            <h1>我的服务</h1>
            <p>这是我提供的服务列表。</p>
            <ul style="margin-left: 20px;">
                <li>网页设计</li>
                <li>网站开发</li>
                <li>技术咨询</li>
            </ul>
        </section>

        <!-- 联系我 -->
        <section id="contact">
            <h1>联系我</h1>
            <p>邮箱：your-email@example.com</p>
            <p>电话：+86 123-4567-8900</p>
        </section>
    </div>
</body>
</html>
